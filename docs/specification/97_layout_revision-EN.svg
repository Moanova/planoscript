<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1100" height="700" fill="#1E1E1E"/>
  <rect x="0" y="0" width="1100" height="40" fill="#2D2D2D"/>
  <line x1="0" y1="40" x2="1100" y2="40" stroke="#383838" stroke-width="1"/>
  <text x="24" y="25" fill="#FFFFFF" font-size="13">Files</text>
  <text x="70" y="25" fill="#FFFFFF" font-size="13">Edit</text>
  <text x="112" y="25" fill="#FFFFFF" font-size="13">Display</text>
  <text x="175" y="25" fill="#FFFFFF" font-size="13">Project</text>
  <text x="237" y="25" fill="#FFFFFF" font-size="13">About</text>

  <!-- Onglets Journey / Agents : sous la barre de menus, en haut à gauche (position inchangée) -->
  <rect x="12" y="48" width="94" height="34" rx="6" fill="#2D2D2D" stroke="#383838" stroke-width="1"/>
  <text x="34" y="70" fill="#CCCCCC" font-size="13">Journey</text>
  <rect x="114" y="48" width="94" height="34" rx="6" fill="#2D2D2D" stroke="#383838" stroke-width="1"/>
  <text x="145" y="70" fill="#CCCCCC" font-size="13">Agents</text>
  <line x1="0" y1="92" x2="860" y2="92" stroke="#383838" stroke-width="1"/>

  <!-- Zone canvas : grille -->
  <g stroke="#333333" stroke-width="1">
    <line x1="80" y1="92" x2="80" y2="700"/><line x1="160" y1="92" x2="160" y2="700"/>
    <line x1="240" y1="92" x2="240" y2="700"/><line x1="320" y1="92" x2="320" y2="700"/>
    <line x1="400" y1="92" x2="400" y2="700"/><line x1="480" y1="92" x2="480" y2="700"/>
    <line x1="560" y1="92" x2="560" y2="700"/><line x1="640" y1="92" x2="640" y2="700"/>
    <line x1="720" y1="92" x2="720" y2="700"/><line x1="800" y1="92" x2="800" y2="700"/>
    <line x1="0" y1="172" x2="860" y2="172"/><line x1="0" y1="252" x2="860" y2="252"/>
    <line x1="0" y1="332" x2="860" y2="332"/><line x1="0" y1="412" x2="860" y2="412"/>
    <line x1="0" y1="492" x2="860" y2="492"/><line x1="0" y1="572" x2="860" y2="572"/>
    <line x1="0" y1="652" x2="860" y2="652"/>
  </g>

  <!-- Nœud Event (cuivre #D19A66) -->
  <rect x="120" y="200" width="180" height="100" rx="6" fill="#2D2D2D" stroke="#D19A66" stroke-width="2"/>
  <text x="210" y="240" fill="#D19A66" font-size="14" text-anchor="middle" font-weight="bold">Event</text>
  <text x="210" y="265" fill="#FFFFFF" font-size="13" text-anchor="middle">Event 1</text>
  <circle cx="120" cy="250" r="7" fill="#1E1E1E" stroke="#F0F0F0" stroke-width="2"/>
  <circle cx="300" cy="250" r="7" fill="#1E1E1E" stroke="#F0F0F0" stroke-width="2"/>
  <line x1="307" y1="250" x2="393" y2="250" stroke="#CCCCCC" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M 393 244 L 403 250 L 393 256 Z" fill="#CCCCCC"/>

  <!-- Nœud State (or doux #E5C07B), survolé : contour blanc doux #F0F0F0 -->
  <rect x="400" y="200" width="180" height="100" rx="6" fill="#2D2D2D" stroke="#F0F0F0" stroke-width="2.5"/>
  <text x="490" y="240" fill="#E5C07B" font-size="14" text-anchor="middle" font-weight="bold">State</text>
  <text x="490" y="265" fill="#FFFFFF" font-size="13" text-anchor="middle">Init Sta</text>
  <circle cx="400" cy="250" r="7" fill="#1E1E1E" stroke="#F0F0F0" stroke-width="2"/>
  <circle cx="580" cy="250" r="7" fill="#1E1E1E" stroke="#F0F0F0" stroke-width="2"/>

  <!-- Nœud Event sélectionné : contour en pointillés -->
  <rect x="210" y="460" width="180" height="100" rx="6" fill="#2D2D2D" stroke="#D19A66" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="300" y="500" fill="#D19A66" font-size="14" text-anchor="middle" font-weight="bold">Event</text>
  <text x="300" y="525" fill="#FFFFFF" font-size="13" text-anchor="middle">Event 2</text>
  <circle cx="210" cy="510" r="7" fill="#1E1E1E" stroke="#F0F0F0" stroke-width="2"/>
  <circle cx="390" cy="510" r="7" fill="#1E1E1E" stroke="#F0F0F0" stroke-width="2"/>

  <!-- Légende -->
  <g font-size="12" fill="#CCCCCC">
    <rect x="440" y="632" width="388" height="56" rx="6" fill="#2D2D2D" stroke="#383838" stroke-width="1"/>
    <rect x="452" y="648" width="14" height="14" fill="none" stroke="#D19A66" stroke-width="2"/>
    <text x="472" y="660">Event</text>
    <rect x="530" y="648" width="14" height="14" fill="none" stroke="#E5C07B" stroke-width="2"/>
    <text x="550" y="660">State</text>
    <circle cx="612" cy="655" r="6" fill="#1E1E1E" stroke="#F0F0F0" stroke-width="2"/>
    <text x="626" y="660">Ancre</text>
    <rect x="676" y="648" width="14" height="14" fill="none" stroke="#F0F0F0" stroke-width="2"/>
    <text x="696" y="660">Survol</text>
    <rect x="754" y="648" width="14" height="14" fill="none" stroke="#D19A66" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="774" y="660">Sélection</text>
  </g>

  <!-- Barre latérale droite : Journey Filter (à venir) -->
  <rect x="860" y="40" width="240" height="660" fill="#2D2D2D"/>
  <line x1="860" y1="40" x2="860" y2="700" stroke="#383838" stroke-width="1"/>
  <text x="884" y="80" fill="#FFFFFF" font-size="14" font-weight="bold">Journey Filter</text>
  <line x1="884" y1="96" x2="1076" y2="96" stroke="#383838" stroke-width="1"/>
  <!-- Liste de parcours : 3 cases à cocher -->
  <rect x="884" y="128" width="16" height="16" rx="3" fill="#2D2D2D" stroke="#F0F0F0" stroke-width="2"/>
  <text x="912" y="141" fill="#FFFFFF" font-size="13">Journey 1</text>
  <rect x="884" y="164" width="16" height="16" rx="3" fill="#2D2D2D" stroke="#F0F0F0" stroke-width="2"/>
  <text x="912" y="177" fill="#FFFFFF" font-size="13">Journey 2</text>
  <rect x="884" y="200" width="16" height="16" rx="3" fill="#2D2D2D" stroke="#F0F0F0" stroke-width="2"/>
  <text x="912" y="213" fill="#FFFFFF" font-size="13">Journey 3</text>
</svg>