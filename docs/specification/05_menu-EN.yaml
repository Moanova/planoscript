# Planoscript ::: General Application Menu
# Version : 2.1
# Date : 28-10-2026
# Content : Retrospective update to reflect the current implementation in main_window.py (latest redesign + EPC01–EPC04: agent management, agent-state associations, agents view)

menu:
  name: General Menu
  items:
    - name: Files
      items:
        - name: New Project...
          shortcut: "Ctrl+N"
          note: "Implemented - Creates a new project"
        - name: Open...
          shortcut: "Ctrl+O"
          note: "Implemented - Loads a new file"
        - name: Close
          shortcut: "Ctrl+W"
          note: "Implmented - Close the current project with confirmation"
        - name: Save
          shortcut: "Ctrl+S"
          note: "Implmented - Disabled if project is unmodified"
        - name: Save as...
          shortcut: "Ctrl+Shift+S"
          note: "Implemented"
        - type: separator
        - name: Export Map
          note: "Not implemented"
        - name: Import Map
          note: "Not implemented"
        - type: separator
        - name: Recent Projects...
          dynamic: true
          description: "Dynamic list of recently opened projects"
          note: "Not implemented � Menu present but functionality missing"
        - type: separator
        - name: Quit
          shortcut: "Ctrl+Q"
          note: "Implemented � Handles save confirmation"

    - name: Edit
      items:
        - name: Undo
          shortcut: "Ctrl+Z"
          note: "Not implemented"
        - name: Redo
          shortcut: "Ctrl+Y"
          note: "Not implemented"
        - name: History
          note: "Not implemented"
        - type: separator
        - name: Cut
          shortcut: "Ctrl+X"
          note: "Not implemented"
        - name: Copy
          shortcut: "Ctrl+C"
          note: "Not implemented"
        - name: Paste
          shortcut: "Ctrl+V"
          note: "Not implemented"
        - name: Delete
          shortcut: "Del"
          note: "Not implemented"

    - name: Display
      items:
        - name: Journey
          items:
            - name: JourneyList
              dynamic: true
              description: Dynamic list of narrative map routes
              behavior:
                user_editable: true
                checked_field: "checked"
                default_checked: true
              note: "Not implemented"
        - name: Zoom
          items:
            - name: Zoom in
              shortcut: "Ctrl+="
              note: "Not implemented - Zoom controls not connected"
            - name: Zoom out
              shortcut: "Ctrl+-"
              note: "Not implemented - Zoom controls not connected"
            - name: Reset
              shortcut: "Ctrl+0"
              note: "Not implemented - Zoom controls not connected"

    - name: Project
      items:
        - name: View
          items:
            - name: Journey
              note: "Not implemented - Tab present in TabBar, active via the tab bar (not via this menu)"
            - name: Agents
              note: "Not implemented - The view is active via the tab bar (SU009, TSK07–TSK15: agents × states matrix in graphical view); the former 'Relations' tab is a leftover from an earlier version and is removed from the MVP"
        - name: Components...
          items:
            - name: Agent
              note: "Implemented - Opens the agent management dialog (FN031, TSK01/TSK02: create/edit/delete with RG064 cascade; SU008, SU009)"
            - name: State
              items:
                - name: New...
                  note: "Implemented - Creates a State node in the center of the workspace"
                - name: Edit
                  note: "Not implemented - Enabled only when a State node is selected"
                - name: Delete
                  note: "Not implemented - Enabled only when a State node is selected"
            - name: Event
              items:
                - name: New...
                  note: "Implemented - Creates an Event node in the center of the workspace"
                - name: Edit
                  note: "Not implemented - Enabled only when an Event node is selected"
                - name: Delete
                  note: "Not implemented - Enabled only when an Event node is selected"
        - name: Relations...
          items:
            - name: Connect State and Event
              note: "Implemented - Activates State-Event relationship creation mode"
            - name: Associate agents with State
              note: "Implemented (FN030, SU008, TSK04) - Opens the agent association dialog for the selected State"
            - name: Edit
              note: "Not implemented - Enabled only when a relation is selected"
            - name: Delete
              note: "Not implemented - Enabled only when a relation is selected"

    - name: About
      items:
        - name: Change Log
          note: "Implemented -Opens ChangeLogDialog"
        - name: About Planoscript
          note: "Implemented - Opens AboutDialog"

  legend:
    description: |
      Elements marked 'dynamic: true' are dynamically generated from application data.
      The notes indicate the current implementation status (28-10-2026).
