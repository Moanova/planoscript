# Planoscript ::: General Application Menu
# Version : 2.2
# Date : 28-10-2026
# Content : Retrospective update to reflect the current implementation in main_window.py (latest redesign + EPC01–EPC04: agent management, agent-state associations, agents view; TSK13: agent submenu New.../Edit/Delete with selection dialog)

menu:
  name: General Menu
  items:
    - name: Files
      items:
        - name: New Project...
          shortcut: "Ctrl+N"
          note: "Implemented - Creates a new project"
        - name: Open...
          shortcut: "Ctrl+O"
          note: "Implemented - Loads a new file"
        - name: Close
          shortcut: "Ctrl+W"
          note: "Implmented - Close the current project with confirmation"
        - name: Save
          shortcut: "Ctrl+S"
          note: "Implmented - Disabled if project is unmodified"
        - name: Save as...
          shortcut: "Ctrl+Shift+S"
          note: "Implemented"
        - type: separator
        - name: Export Map
          note: "Not implemented"
        - name: Import Map
          note: "Not implemented"
        - type: separator
        - name: Recent Projects...
          dynamic: true
          description: "Dynamic list of recently opened projects"
          note: "Not implemented � Menu present but functionality missing"
        - type: separator
        - name: Quit
          shortcut: "Ctrl+Q"
          note: "Implemented � Handles save confirmation"

    - name: Edit
      items:
        - name: Undo
          shortcut: "Ctrl+Z"
          note: "Not implemented"
        - name: Redo
          shortcut: "Ctrl+Y"
          note: "Not implemented"
        - name: History
          note: "Not implemented"
        - type: separator
        - name: Cut
          shortcut: "Ctrl+X"
          note: "Not implemented"
        - name: Copy
          shortcut: "Ctrl+C"
          note: "Not implemented"
        - name: Paste
          shortcut: "Ctrl+V"
          note: "Not implemented"
        - name: Delete
          shortcut: "Del"
          note: "Not implemented"

    - name: Display
      items:
        - name: Journey
          items:
            - name: JourneyList
              dynamic: true
              description: Dynamic checkable list of the journeys of the narrative map; the checked item is the active journey. A checkable "All journeys" entry on top disables the journey filter (FN029, TSK27 design 31-10-2026)
              behavior:
                user_editable: true
                checked_field: "checked"
                default_checked: true
              note: 'Implemented (TSK23) - Rebuilt on aboutToShow; clicking an item activates that journey (FN026, RG023). Replaces the former Display > Events submenu. The "All journeys" filter entry is designed (TSK27) but not yet implemented'
        - name: Zoom
          items:
            - name: Zoom in
              shortcut: "Ctrl+="
              note: "Not implemented - Zoom controls not connected"
            - name: Zoom out
              shortcut: "Ctrl+-"
              note: "Not implemented - Zoom controls not connected"
            - name: Reset
              shortcut: "Ctrl+0"
              note: "Not implemented - Zoom controls not connected"

    - name: Project
      items:
        - name: View
          items:
            - name: Journey
              note: "Not implemented - Tab present in TabBar, active via the tab bar (not via this menu)"
            - name: Agents
              note: "Not implemented - The view is active via the tab bar (SU009, TSK07–TSK15: agents × states matrix in graphical view); the former 'Relations' tab is a leftover from an earlier version and is removed from the MVP"
        - name: Components...
          items:
            - name: Agent
              items:
                - name: New...
                  note: "Implemented (TSK13 + TSC review 28-10-2026) - Behavior depends on the active view. Journey view: opens the 'New Agent' dialog, pre-filled with a default label 'Agent {id}' (editable). Agents view: creates the agent directly in the matrix row, with the default label (no dialog). Enabled as soon as a project is open (FN031, TSK01/TSK02; SU008, SU009)"
                - name: Edit
                  note: "Implemented (TSK13 + TSC review 28-10-2026) - Journey view: opens an agent selection dialog, then the pre-filled 'New Agent' dialog; enabled as soon as at least one agent exists. Agents view: opens the edition dialog directly on the selected agent card; disabled when no agent card is selected (FN031; RG064 cascade unchanged)"
                - name: Delete
                  note: "Implemented (TSK13 + TSC review 28-10-2026) - Journey view: opens an agent selection dialog, then a confirmation with the number of cascaded associations (RG064); enabled as soon as at least one agent exists. Agents view: deletes the selected agent card directly, with the same RG064 confirmation; disabled when no agent card is selected (FN031)"
              note: "Global menu (menu bar): accessible from both the Journey and Agents views (TSK13); the agent card context menu offers the same actions, aligned on the global menu (TSC review 28-10-2026)"
            - name: State
              items:
                - name: New...
                  note: "Implemented - Creates a State node in the center of the workspace"
                - name: Edit
                  note: "Not implemented - Enabled only when a State node is selected"
                - name: Delete
                  note: "Not implemented - Enabled only when a State node is selected"
            - name: Event
              items:
                - name: New...
                  note: "Implemented - Creates an Event node in the center of the workspace; when the Agents view is active (global menu or grid context menu), the view switches to Journey and the new node is selected (TSK13)"
                - name: Edit
                  note: "Not implemented - Enabled only when an Event node is selected"
                - name: Delete
                  note: "Not implemented - Enabled only when an Event node is selected"
        - name: Journeys...
          items:
            - name: New...
              note: "Implemented (TSK23) - Opens the 'New Journey' dialog (default label 'Journey {id}', editable); the new journey is automatically activated (FN023, RG023). Enabled as soon as a project is open"
            - name: Duplicate...
              note: "Implemented (TSK24) - Opens a journey selection dialog, then the 'Duplicate Journey' dialog pre-filled with the source label suffixed ' (copy)' and the source note (both editable); duplicates the journey and copies its journey nodes (FN025). The copy is not activated (RG023 revised) and not default (RG055). Enabled as soon as at least one journey exists"
            - name: Edit
              note: "Implemented (TSK23, review 29-10-2026) - Opens an Ok/Cancel journey selection dialog (a journey is always selected), then the edition dialog (label + note, FN024). Creation from the separate New... entry; deletion from the separate Delete... entry (TSK25 UX review 30-10-2026)"
            - name: Delete...
              note: "Implemented (TSK25, UX review 30-10-2026) - Opens an Ok/Cancel journey selection dialog, then a confirmation (FN027); the last journey of the map is refused with an explanatory message (RG018). Orphan journey nodes are switched to the default journey (RG036/RG066). Enabled as soon as at least one journey exists"
        - name: Relations...
          items:
            - name: Connect State and Event
              note: "Implemented - Activates State-Event relationship creation mode"
            - name: Associate agents with State
              note: "Implemented (FN030, SU008, TSK04) - Opens the agent association dialog for the selected State"
            - name: Edit
              note: "Implemented (TSK21, FN021/SU004) - Opens the relation edition dialog (note + checkable journey list, RG027 revised) for the selected connection. Enabled only when a relation is selected"
            - name: Delete
              note: "Implemented - Deletes the selected connection's arc. Enabled only when a relation is selected"

    - name: About
      items:
        - name: Change Log
          note: "Implemented -Opens ChangeLogDialog"
        - name: About Planoscript
          note: "Implemented - Opens AboutDialog"

  legend:
    description: |
      Elements marked 'dynamic: true' are dynamically generated from application data.
      The notes indicate the current implementation status (28-10-2026).
